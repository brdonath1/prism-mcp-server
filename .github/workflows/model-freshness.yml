name: Model Freshness

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-freshness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # MODEL_BUMP_PAT (fine-grained PAT, this repo, contents + pull-requests
      # read/write) makes the bump PR fire pull_request workflows — PRs created
      # with the default GITHUB_TOKEN never trigger CI, leaving each weekly
      # bump PR unmergeable until a human pushes a commit (SRV-56, brief-455).
      # Until the operator provisions the secret, this falls back to
      # GITHUB_TOKEN (status quo).
      - name: Check model freshness
        id: freshness
        run: node scripts/check-model-freshness.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.MODEL_BUMP_PAT || secrets.GITHUB_TOKEN }}

      - name: Create bump PR
        if: steps.freshness.outputs.has_bumps == 'true'
        env:
          GH_TOKEN: ${{ secrets.MODEL_BUMP_PAT || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/model-freshness-$(date +%Y%m%d)"

          # Ensure the label exists (no-op if it already does)
          gh label create model-bump --description "Automated model version bump" --color "0075ca" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/models.ts
          git commit -m "chore: bump model pins to latest Anthropic releases"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: bump model pins to latest Anthropic releases" \
            --label "model-bump" \
            --body-file /tmp/model-bump-body.md

      # brief-s5 §6: the model-capability registry's `api` column is the one
      # column with a machine-readable authority (models.retrieve().
      # max_input_tokens). This job is the only place in CI holding
      # ANTHROPIC_API_KEY, so the drift check runs HERE rather than in ci.yml,
      # where the test self-skips for lack of a live key. It fails the job
      # loudly when Anthropic ships a change, and its failure message flags any
      # chat cell not re-verified since — chat/claude_code are hand-maintained
      # and never auto-corrected from API evidence.
      #
      # LAST, and `!cancelled()` rather than a plain dependency: a drift failure
      # must not suppress the freshness check or its bump PR above. Those are
      # the mechanism that tells the operator a new model shipped, which is
      # exactly the situation where the api column is most likely to have
      # drifted. Two independent signals, neither gating the other.
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: npm ci

      - name: Model capability registry — API column drift check
        if: ${{ !cancelled() }}
        run: npx vitest run tests/model-capabilities-api-drift.test.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
